name: automatedTests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-tests:
    runs-on: ubuntu-latest
    #container:
    #  image: eclipse-temurin:17-jdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven  # cache all dependencies so we don't need to download them again for the next run

      # 1. Compile the project to download Playwright and generate the driver CLI
      - name: Compile project
        run: mvn test-compile

        # 2. Install the Playwright browsers on the Ubuntu runner
      - name: Install Playwright Browsers
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"

      - name: Run unit tests
        run: mvn test