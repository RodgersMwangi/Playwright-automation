name: automatedTests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15 #github actions property, hard limit where github kills the runner
    #container:
    #  image: eclipse-temurin:17-jdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven  # cache all dependencies so we don't need to download them again for the next run

      # 1. Compile the project to download Playwright and generate the driver CLI
      - name: Compile project
        run: mvn test-compile

        # 2. Install the Playwright browsers on the Ubuntu runner
      - name: Install Playwright Browsers
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"

      - name: Run unit tests with Retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10  #input parameter for nick-fields/retry, how long to wait before retrying
          max_attempts: 2
          command: mvn test

      - name: Upload report
        if: always()  # This ensures the report uploads even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-output/ExtentReport.html

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed screenshots
          path: target/screenshots/failed
