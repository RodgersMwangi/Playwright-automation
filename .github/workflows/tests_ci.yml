name: automatedTests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-tests:
    runs-on: ubuntu-latest
    #container:
    #  image: eclipse-temurin:17-jdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven  # cache all dependencies so we don't need to download them again for the next run

      - name: Build with maven
        run: mvn -B package --file pom.xml

      - name: Run unit tests
        run: mvn test